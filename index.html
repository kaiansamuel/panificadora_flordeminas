      if (!m || !m.imports) return;
      Object.keys(m.imports).forEach(function (k) {
        var target = toOriginal(m.imports[k]);
        if (!target) return;
        var key = /^(\.{0,2}\/|https?:)/i.test(k) ? (toOriginal(k) || k) : k;
        if (/\/$/.test(k)) {  // prefixo: cada JS gravado sob o destino vira uma entrada exata
          CFG.entries.forEach(function (e) {
            if (e.method !== 'GET' || stripHash(e.url).indexOf(target) !== 0) return;
            var u = blobUrlOf(e);
            if (u) imports[key + stripHash(e.url).slice(target.length)] = u;
          });
          imports[key] = target;
        } else {
          imports[key] = mapUrl(target, null, 'script', true);
        }
      });
    });
    var el = doc.createElement('script');
    el.setAttribute('type', 'importmap');
    el.textContent = JSON.stringify({ imports: imports });
    doc.head.insertBefore(el, doc.head.firstChild);
  }

  function boot() {
    var doc = new DOMParser().parseFromString(textOf(CFG.doc), 'text/html');
    var base = doc.querySelector('base[href]');
    if (base) { try { BASE = new URL(base.getAttribute('href'), ORIG).href; } catch (err) { /* ignora */ } }
    doc.querySelectorAll('base').forEach(function (b) { b.remove(); });
    doc.querySelectorAll('meta[http-equiv]').forEach(function (m) {
      if (/content-security-policy|refresh/i.test(m.getAttribute('http-equiv'))) m.remove();
    });
    importMap(doc);
    rewriteTree(doc);
    var root = doc.documentElement;
    var attrs = Array.prototype.map.call(root.attributes, function (a) {
      return ' ' + a.name + '="' + a.value.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '"';
    }).join('');
    W.__wd3Booted = true;
    var me = D.currentScript;
    if (me) me.remove();
    D.write('<html' + attrs + '>' + root.innerHTML + '</html>');
  }

  try {
    boot();
  } catch (err) {
    W.__wd3BootError = String(err && err.stack || err);
    D.write('<p style="font:15px system-ui,sans-serif;padding:24px">Website Downloader 3.0: não foi possível ' +
      'montar a página a partir deste arquivo (' + String(err && err.message || err).replace(/</g, '&lt;') + ').</p>');
  }
})();
</script>
